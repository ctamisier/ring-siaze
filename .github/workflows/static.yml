# Workflow pour compiler et déployer une application Vue / Vite sur GitHub Pages
name: Deploy Vue static content to Pages

on:
  # S'exécute automatiquement lors d'un push sur main
  push:
    branches: ["main"]

  # Permet le déclenchement manuel depuis l'onglet Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Premier job : Récupération, installation, compilation et packaging
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Configurer l'environnement Node.js (Recommandé: v20 ou v22 pour Vite 8)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Active le cache pour accélérer les futurs builds

      # 2. Installer les dépendances (npm ci est plus strict et rapide que npm install)
      - name: Install dependencies
        run: npm ci

      # 3. Compiler l'application (Exécute vue-tsc et vite build)
      - name: Build application
        run: npm run build

      # 4. Configurer Pages pour le workflow
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 5. Envoyer le dossier dist généré par le build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/'

  # Deuxième job : Déploiement de l'artéfact unique
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build # Attend obligatoirement que la compilation soit réussie
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4